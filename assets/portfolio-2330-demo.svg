<svg xmlns="http://www.w3.org/2000/svg" width="620" height="450" viewBox="0 0 620 450" role="img" aria-labelledby="title desc">
<title id="title">2330 持股明細｜虛構示意</title><desc id="desc">總庫存 1,000 股已包含一般持股 700 股與質押持股 300 股。</desc>
<rect width="620" height="450" rx="22" fill="#f0f4f6"/>
<g font-family="system-ui, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
<path d="M22 0h576q22 0 22 22v48H0V22Q0 0 22 0" fill="#143647"/>
<text x="28" y="44" font-size="23" font-weight="700" fill="white">持股明細</text>
<text x="590" y="44" text-anchor="end" font-size="18" fill="#d7edf1">虛構資料示意</text>
<rect x="20" y="88" width="580" height="340" rx="18" fill="white"/>
<text x="46" y="135" font-size="30" font-weight="700" fill="#163749">2330 台積電</text>
<text x="46" y="195" font-size="21" fill="#334e5c">庫存總股數（含質押）</text>
<text x="570" y="197" text-anchor="end" font-size="36" font-weight="700" fill="#163749">1,000 股</text>
<rect x="46" y="222" width="528" height="16" rx="8" fill="#d69a3b"/>
<path d="M54 222h361.6v16H54a8 8 0 0 1 0-16" fill="#187568"/>
<circle cx="54" cy="287" r="8" fill="#187568"/>
<text x="78" y="295" font-size="23" fill="#163749">一般持股（未質押）</text>
<text x="574" y="295" text-anchor="end" font-size="26" font-weight="700" fill="#163749">700 股</text>
<path d="M46 320h528" stroke="#dce4e6"/>
<circle cx="54" cy="351" r="8" fill="#d69a3b"/>
<text x="78" y="359" font-size="23" fill="#163749">質押持股</text>
<text x="574" y="359" text-anchor="end" font-size="26" font-weight="700" fill="#163749">300 股</text>
<text x="46" y="404" font-size="30" font-weight="700" fill="#163749">估算維持率，只計入質押的 300 股。</text>
</g></svg>
